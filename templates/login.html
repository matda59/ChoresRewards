<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <title>ChoresRewards</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/mascot-transp.png') }}">
    <script>
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('cr-theme') || 'dark'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=20261123a">
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <style>
        /* The shared stylesheet hides the overlay until auth.js runs. On this
           page there is nothing else to show, so keep the PIN card visible. */
        #pin-overlay { display: flex !important; }
        #site-content { display: none !important; }
    </style>
</head>
<body data-login-shell="1">
    <div id="pin-overlay" class="auth-overlay" style="display:flex;">
        <div class="auth-pin-screen" style="display:flex;">
            <div class="auth-app-header">
                <img src="{{ url_for('static', filename='images/mascot-transp.png') }}" class="auth-mascot" alt="">
                <span class="auth-app-name">ChoresRewards</span>
            </div>
            <div class="auth-pin-card">
                <p class="auth-pin-hint">Enter PIN to continue</p>
                <input id="master-pin-input" type="password" maxlength="64" placeholder="••••"
                       autocomplete="current-password" class="auth-pin-input">
                <div id="master-pin-error" class="auth-pin-error"></div>
                <button id="master-pin-submit" type="button" class="auth-pin-submit">Unlock</button>
            </div>
        </div>
    </div>
    <div id="site-content" hidden></div>
    <noscript>
        <p style="text-align:center; padding:2rem;">JavaScript is required to unlock ChoresRewards.</p>
    </noscript>
</body>
</html>
