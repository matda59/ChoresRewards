services:
  choresawards:
    image: choresrewards:local
    pull_policy: never
    ports:
      - "3112:3000"
    volumes:
      - ./instance:/app/instance
      - uploads_data:/app/static/uploads
    environment:
      - TZ=Australia/Adelaide  # Adjust this to your actual timezone
      - ENABLE_GOOGLE_CALENDAR=true
      - CHORESREWARDS_TELEMETRY=on
      # - CR_SECRET_KEY=replace-with-a-long-random-string
      # - CR_COOKIE_SECURE=0   # plain HTTP on a LAN only; HTTPS sets Secure itself
      # Read-only assistant key. Leave unset to disable. At least 32 characters.
      # Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"
      # - CR_READONLY_API_KEY=replace-with-the-generated-value
      # Write key for the same assistant. Must be different from the read-only key.
      # - CR_WRITE_API_KEY=replace-with-a-different-generated-value
    restart: always

volumes:
  uploads_data:
