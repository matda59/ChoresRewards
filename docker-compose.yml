services:
  choresawards:
    image: choresrewards:local
    pull_policy: never
    ports:
      - "3112:3000"
    volumes:
      - ./instance:/app/instance
      - uploads_data:/app/static/uploads
    environment:
      - TZ=Australia/Adelaide  # Adjust this to your actual timezone
      - ENABLE_GOOGLE_CALENDAR=true
      - CHORESREWARDS_TELEMETRY=on
    restart: always

volumes:
  uploads_data:
